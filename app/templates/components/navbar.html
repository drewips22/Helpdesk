<!-- Top Navbar for Teknisi/Admin -->
<header class="top-navbar">
    <div class="navbar-left">
        <button class="sidebar-toggle d-lg-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <div class="page-title">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
        </div>
    </div>
    <div class="navbar-right">
        <!-- Dark Mode Toggle -->
        <button class="btn-icon" id="darkModeToggle" title="Mode Gelap">
            <i class="bi bi-moon-fill"></i>
        </button>

        <!-- Notifications -->
        <div class="dropdown">
            <button class="btn-icon position-relative" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell-fill"></i>
                <span class="notification-badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notification-dropdown">
                <h6 class="dropdown-header">Notifikasi</h6>
                <div id="notifList">
                    <div class="dropdown-item text-muted text-center py-3">
                        <small>Memuat notifikasi...</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <button class="btn-icon" title="Pengaturan" onclick="window.location='{{ url_for('auth.profile') }}'">
            <i class="bi bi-gear"></i>
        </button>

        <!-- User Menu -->
        <div class="dropdown">
            <button class="user-menu-btn" data-bs-toggle="dropdown">
                <div class="user-avatar-sm">{{ current_user.nama[0] | upper }}</div>
                <span class="d-none d-md-inline">{{ current_user.nama }}</span>
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{{ url_for('auth.profile') }}"><i class="bi bi-person me-2"></i>Profil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-2"></i>Keluar</a></li>
            </ul>
        </div>
    </div>
</header>
